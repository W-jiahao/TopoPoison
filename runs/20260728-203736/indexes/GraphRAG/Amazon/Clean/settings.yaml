models:
  default_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: "microsoft/phi-4"
    api_base: "http:"
    model_supports_json: true
    temperature: 0
    concurrent_requests: 8
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 3
    request_timeout: 360.0
  default_embedding_model:
    type: embedding
    model_provider: openai
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: unused-no-embedding-model
    api_base: "http:"
    concurrent_requests: 1
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 1
    request_timeout: 360.0

input:
  storage:
    type: file
    base_dir: input
  file_type: json
  file_pattern: "corpus\\.json"
  text_column: text
  title_column: title
  metadata: [title]

chunks:
  size: 1200
  overlap: 100
  group_by_columns: [id]

output:
  type: file
  base_dir: output

cache:
  type: file
  base_dir: cache

reporting:
  type: file
  base_dir: logs

workflows:
  - load_input_documents
  - create_base_text_units
  - create_final_documents
  - extract_graph
  - finalize_graph
  - extract_covariates
  - create_communities
  - create_final_text_units
  - create_community_reports

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default
    overwrite: true

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store
  batch_size: 16
  batch_max_tokens: 8191

extract_graph:
  model_id: default_chat_model
  prompt: extract_graph.prompt
  entity_types: [item, attribute, event]
  max_gleanings: 0

summarize_descriptions:
  model_id: default_chat_model
  max_length: 300
  max_input_tokens: 3200

extract_claims:
  enabled: false

community_reports:
  model_id: default_chat_model
  max_length: 1000
  max_input_length: 2800

cluster_graph:
  max_cluster_size: 4
  use_lcc: false

embed_graph:
  enabled: false

umap:
  enabled: false

snapshots:
  graphml: true
  embeddings: false
  raw_graph: false

local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model

global_search:
  chat_model_id: default_chat_model
  map_prompt: global_map.prompt
  reduce_prompt: global_reduce.prompt

drift_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model

basic_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
